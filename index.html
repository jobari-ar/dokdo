<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독도의 날</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f5ee; /* 이미지 배경과 유사한 아이보리 톤 */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .splash-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 화면에 가득 차게 설정 (비율 유지 시 contain으로 변경) */
        }
    </style>
</head>
<body>
    <!-- 파일명에 공백이 있으므로 URL 인코딩(%20)이 포함된 경로를 사용합니다 -->
    <img src="./splash.png" alt="독도의 날 첫화면" class="splash-image">
</body>
</html>
